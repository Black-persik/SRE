apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: telegram
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token: "9282549193:AAGXM-2tIyCAZGYD72ZaTR5fkEq9Ss6nG9U_example"
            chat_id: 795971235
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:latest
          args:
            - -datasource.url=http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            - -rule=/etc/alerts/*.yaml
            - -notifier.url=http://alertmanager:9093
          volumeMounts:
            - name: rules
              mountPath: /etc/alerts
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
